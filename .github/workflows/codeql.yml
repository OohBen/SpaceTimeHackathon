name: CodeQL

on:
  pull_request:
    branches:
      - main
      - "epic/**"
  push:
    branches:
      - main
      - "epic/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

      - name: Remediation - CodeQL
        if: failure()
        run: |
          echo "Remediation: inspect the CodeQL alert path and fix the source or data-flow issue."
          echo "Fast diagnosis: open the Security tab or the SARIF annotation attached to this run."
