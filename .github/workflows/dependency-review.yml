name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip private repositories without Advanced Security
        if: ${{ github.event.repository.private }}
        run: |
          echo "Dependency Review requires Dependency graph plus GitHub Advanced Security on private repositories."
          echo "Skipping until those repository security features are enabled."
      - name: Review dependency changes
        id: dependency-review
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
      - name: Dependency review fallback
        if: ${{ !github.event.repository.private && steps.dependency-review.outcome == 'failure' }}
        run: |
          echo "Dependency review could not complete - Dependency Graph or Advanced Security may not be enabled."
          echo "See https://github.com/${{ github.repository }}/settings/security_analysis"
          echo "Falling back to non-blocking warning; security-quality-gates.yml already covers this path."
